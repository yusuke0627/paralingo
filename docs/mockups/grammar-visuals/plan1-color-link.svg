<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#e8eef9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg1)"/>
  <rect x="90" y="80" width="1100" height="560" rx="24" fill="#ffffff" stroke="#d6deee"/>

  <text x="140" y="150" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#1e293b">Plan 1: Color Link Mode</text>
  <text x="140" y="188" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#475569">Same color = modifier and its target</text>

  <rect x="140" y="245" width="1000" height="140" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="170" y="320" font-family="Georgia, serif" font-size="40" fill="#0f172a">The </text>
  <rect x="255" y="276" width="108" height="52" rx="10" fill="#dbeafe"/>
  <text x="271" y="314" font-family="Georgia, serif" font-size="38" fill="#1e3a8a">book</text>

  <rect x="385" y="276" width="430" height="52" rx="10" fill="#dbeafe"/>
  <text x="402" y="314" font-family="Georgia, serif" font-size="34" fill="#1e3a8a">that I bought yesterday</text>
  <text x="832" y="320" font-family="Georgia, serif" font-size="40" fill="#0f172a"> is on the desk.</text>

  <rect x="140" y="430" width="1000" height="130" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="170" y="505" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#9a3412">私が昨日買ったその本は机の上にある。</text>

  <circle cx="175" cy="600" r="10" fill="#1e3a8a"/>
  <text x="200" y="607" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#334155">Target noun + modifying clause share one color family</text>
</svg>
