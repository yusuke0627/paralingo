  <text x="470" y="120" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Plan 2: Tap to Reveal</text>
  <text x="470" y="150" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#64748b">Default view is clean. Relation appears on tap.</text>

