  <rect x="470" y="520" width="340" height="80" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="490" y="552" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9a3412">Tapped token: book</text>
  <text x="490" y="580" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9a3412">Modified by: that I bought yesterday</text>
