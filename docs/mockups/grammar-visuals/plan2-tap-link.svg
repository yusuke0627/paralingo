  <text x="562" y="245" font-family="Georgia, serif" font-size="28" fill="#1e3a8a">book</text>
  <text x="640" y="245" font-family="Georgia, serif" font-size="30" fill="#111827"> is on the desk.</text>
  <text x="490" y="294" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#334155">その本は机の上にある。</text>

