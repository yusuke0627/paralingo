<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg4)"/>
  <rect x="100" y="60" width="1080" height="600" rx="26" fill="#ffffff" stroke="#bbf7d0"/>

  <text x="150" y="130" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#14532d">Plan 4: Chunk Cards</text>
  <text x="150" y="168" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#166534">Break sentence into chunks and show hierarchy with indentation</text>

  <rect x="160" y="220" width="930" height="86" rx="14" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="190" y="257" font-family="Georgia, serif" font-size="30" fill="#111827">Main: The book is on the desk.</text>
  <text x="190" y="288" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#4b5563">主節: その本は机の上にある。</text>

  <rect x="220" y="330" width="870" height="86" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="250" y="367" font-family="Georgia, serif" font-size="29" fill="#1e3a8a">Modifier: that I bought yesterday</text>
  <text x="250" y="398" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1d4ed8">修飾節: 私が昨日買った</text>

  <rect x="280" y="440" width="810" height="86" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="310" y="477" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#9a3412">Targets chunk above: book</text>
  <text x="310" y="508" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9a3412">被修飾語: book</text>

  <line x1="205" y1="305" x2="255" y2="330" stroke="#94a3b8" stroke-width="3"/>
  <line x1="265" y1="416" x2="315" y2="440" stroke="#94a3b8" stroke-width="3"/>
